<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>Ludo Online</title>
<style>
:root{
  --bg:#0f1420;--bg2:#1a2233;--panel:#1e2940;--panel2:#25324e;
  --text:#eef2f9;--muted:#8b98b3;--accent:#4f8cff;
  --red:#ef4444;--green:#22c55e;--yellow:#eab308;--blue:#3b82f6;
  --radius:14px;--shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(1200px 600px at 50% -10%,#223052 0%,var(--bg) 60%);
  color:var(--text);display:flex;flex-direction:column;align-items:center;
  min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 10px 20px;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent;
}
h1{margin:8px 0 4px;font-size:clamp(20px,5vw,28px);letter-spacing:.5px;
   background:linear-gradient(90deg,#4f8cff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}

button,input{font:inherit}
button{
  padding:11px 16px;border-radius:12px;border:0;cursor:pointer;
  background:linear-gradient(180deg,#5b96ff,#3b76e0);color:#fff;font-weight:600;
  box-shadow:0 2px 0 #2c5bb8,0 6px 16px rgba(79,140,255,.25);
  transition:transform .08s ease,box-shadow .15s ease,filter .15s ease;
  min-height:44px;
}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(2px);box-shadow:0 0 0 #2c5bb8,0 3px 10px rgba(79,140,255,.2)}
button:disabled{background:#2a3550;box-shadow:none;color:#5f6d8a;cursor:not-allowed;transform:none;filter:none}
input{
  padding:11px 14px;border-radius:12px;border:1px solid #2e3b5a;
  background:var(--panel);color:var(--text);min-height:44px;outline:none;
  transition:border-color .15s ease,box-shadow .15s ease;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.18)}
input[readonly]{color:var(--muted)}

#lobby{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:20px;width:100%;max-width:420px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border-radius:var(--radius);
      box-shadow:var(--shadow);padding:16px;width:100%;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;width:100%}

#game{display:flex;flex-direction:column;align-items:center;width:100%;max-width:760px;gap:10px}
.topbar{display:flex;gap:8px;align-items:center;width:100%;background:var(--panel);padding:8px 12px;
        border-radius:var(--radius);box-shadow:var(--shadow);flex-wrap:wrap;justify-content:space-between}
.room-tag{font-weight:700;letter-spacing:1px;color:#a9c4ff;font-size:13px}
.pill{font-size:12px;color:var(--muted);padding:4px 10px;border-radius:999px;background:#0e1727;border:1px solid #22304a}
.pill.on{color:#7ee29b;border-color:#1f4d33;background:#0f2a1c}
.pill.off{color:#ff9a9a;border-color:#5a2a2a;background:#2a1313}

#pls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:100%}
.pl{
  display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;
  background:var(--panel);border:1px solid #26344f;font-size:14px;min-width:0;
  transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease;
}
.pl .dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;box-shadow:0 0 0 2px rgba(255,255,255,.15) inset}
.pl .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .meta{color:var(--muted);font-size:11px;margin-left:auto}
.pl.turn{border-color:#fff;box-shadow:0 0 0 2px #fff inset,0 0 18px rgba(255,255,255,.15);animation:pulse 1.6s ease-in-out infinite}
.pl.off{opacity:.45}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px #fff inset,0 0 10px rgba(255,255,255,.08)}50%{box-shadow:0 0 0 2px #fff inset,0 0 24px rgba(255,255,255,.25)}}

.board-wrap{position:relative;width:100%;display:flex;justify-content:center}
.bw{position:relative;width:min(94vw,600px);--d:60px}
canvas{width:100%;height:auto;display:block;border-radius:18px;background:#fff;
       box-shadow:0 20px 40px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05);
       touch-action:manipulation}

.controls{display:flex;align-items:center;gap:14px;background:var(--panel);padding:12px 16px;
          border-radius:var(--radius);box-shadow:var(--shadow);width:100%;justify-content:center;flex-wrap:wrap}
#dwrap{position:absolute;left:50%;top:50%;width:var(--d);height:var(--d);margin:calc(var(--d)/-2) 0 0 calc(var(--d)/-2);z-index:3;user-select:none;-webkit-user-select:none}
#dwrap::before{content:'';position:absolute;inset:-12px;border-radius:50%}
#dwrap.can{cursor:pointer}#dwrap.can::after{content:'';position:absolute;inset:-7px;border-radius:50%;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 0 18px 4px rgba(255,255,255,.5);animation:glow 1.3s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.3}}
#dsh{position:absolute;left:8%;right:8%;bottom:-10%;height:20%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(4px)}
#dscene{position:relative;width:100%;height:100%;perspective:calc(var(--d)*5);transition:transform .15s}
#dwrap.can:hover #dscene{transform:scale(1.1)}#dwrap.can:active #dscene{transform:scale(.93)}
#dbody,#cube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
.f{position:absolute;inset:0;border-radius:calc(var(--d)*.2);background:linear-gradient(145deg,#fff 0%,#f2eddf 60%,#d9d2bf 100%);box-shadow:inset 0 0 calc(var(--d)*.14) rgba(0,0,0,.22),inset 0 calc(var(--d)*.03) calc(var(--d)*.03) rgba(255,255,255,.9);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:calc(var(--d)*.15);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f i{margin:auto;width:calc(var(--d)*.17);height:calc(var(--d)*.17);border-radius:50%;background:radial-gradient(circle at 35% 30%,#555,#0d0d0d)}
.f1{transform:translateZ(calc(var(--d)/2))}.f6{transform:rotateY(180deg) translateZ(calc(var(--d)/2))}.f3{transform:rotateY(90deg) translateZ(calc(var(--d)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--d)/2))}.f2{transform:rotateX(90deg) translateZ(calc(var(--d)/2))}.f5{transform:rotateX(-90deg) translateZ(calc(var(--d)/2))}
#msg{text-align:center;min-height:22px;font-size:14px;color:#cfd8ea;width:100%;max-width:560px}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:#111a2b;border:1px solid #2a3a5c;color:#e6eeff;padding:10px 16px;border-radius:12px;
  font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:10;box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:720px){
  #pls{grid-template-columns:repeat(4,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>

<h1>🎲 LUDO ONLINE</h1>
<div class="sub">Play with friends — share the room link</div>

<div id="lobby">
  <div class="card">
    <input id="name" placeholder="Your name" maxlength="12" autocomplete="off">
    <button id="go">Create room</button>
  </div>
</div>

<div id="game" hidden>
  <div class="topbar">
    <span class="room-tag" id="roomTag">ROOM —</span>
    <div class="row" style="flex:0 0 auto;width:auto;gap:6px">
      <span class="pill" id="connPill">●</span>
      <span class="pill" id="countPill">0 players</span>
      <button id="copy" style="padding:8px 12px;min-height:36px;font-size:13px">Copy link</button>
    </div>
  </div>

  <div id="pls"></div>
  <div id="msg"></div>

  <div class="controls">
    <button id="start" hidden>Start game</button>
    <button id="roll" disabled>Roll</button>
  </div>

  <div class="board-wrap">
    <div class="bw" id="bw"><canvas id="cv" width="600" height="600"></canvas>
<div id="dwrap" title="Roll"><div id="dsh"></div><div id="dscene"><div id="dbody"><div id="cube"></div></div></div></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
const COL=['#ef4444','#22c55e','#eab308','#3b82f6'],NAMES=['Red','Green','Yellow','Blue'];
const START=[0,13,26,39],SAFE=[0,8,13,21,26,34,39,47],C=40;
const PATH=[];
[[1,6,1,0,5],[6,5,0,-1,6],[7,0,1,0,2],[8,1,0,1,5],[9,6,1,0,6],[14,7,0,1,2],
 [13,8,-1,0,5],[8,9,0,1,6],[7,14,-1,0,2],[6,13,0,-1,5],[5,8,-1,0,6],[0,7,0,-1,2]]
 .forEach(function(a){var x=a[0],y=a[1],dx=a[2],dy=a[3],n=a[4];for(var k=0;k<n;k++)PATH.push([x+dx*k,y+dy*k])});
const HC=function(s,k){return [[1+k,7],[7,1+k],[13-k,7],[7,13-k]][s];};
const YARD=[[0,0],[9,0],[9,9],[0,9]],YO=[[1.5,1.5],[3.5,1.5],[1.5,3.5],[3.5,3.5]],FIN=[[5.8,7],[7,5.8],[8.2,7],[7,8.2]];
function cellOf(s,i,p){
  if(p<0)return[YARD[s][0]+YO[i][0],YARD[s][1]+YO[i][1]];
  if(p<=50)return PATH[(START[s]+p)%52];
  if(p<56)return HC(s,p-51);
  return[FIN[s][0]+(i-1.5)*.1,FIN[s][1]+(i-1.5)*.1];
}

var $=function(id){return document.getElementById(id);};
var cv=$('cv'),g=cv.getContext('2d');
var pid=localStorage.pid||(localStorage.pid=Math.random().toString(36).slice(2)+Date.now().toString(36));
var ws=null,st=null,lastSeq=-1,anim=null,lastRolls=null,rolling=false;
var room=new URLSearchParams(location.search).get('room');

$('name').value=localStorage.name||'';
if(room)$('go').textContent='Join room '+room.toUpperCase();
$('go').onclick=function(){
  var n=$('name').value.trim()||'Player';
  localStorage.name=n;
  if(!room){room=Math.random().toString(36).slice(2,7).toUpperCase();history.replaceState(0,'','?room='+room);}
  $('roomTag').textContent='ROOM '+room.toUpperCase();
  connect();
};

function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){el.classList.remove('show');},2200);}
function setConn(ok){var p=$('connPill');p.textContent=ok?'● Online':'● Reconnecting…';p.classList.toggle('on',ok);p.classList.toggle('off',!ok);}

function connect(){
  $('lobby').hidden=true;$('game').hidden=false;
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=function(){setConn(true);lastSeq=-1;lastMsg=Date.now();ws.send(JSON.stringify({t:'join',room:room,pid:pid,name:localStorage.name}));Q.splice(0).forEach(function(m){ws.send(m);});};
  ws.onmessage=function(e){
    var d=JSON.parse(e.data);lastMsg=Date.now();if(d.pong)return;
    if(d.err){$('msg').textContent=d.err;$('roll').disabled=true;toast(d.err);if(rolling&&!D.res)endRoll();return;}
    if(typeof d.seq==='number'&&d.seq<lastSeq)return;
    lastSeq=d.seq!=null?d.seq:lastSeq;
    handleState(d);
  };
  ws.onclose=function(){setConn(false);setTimeout(connect,1500);};
}

var lastMsg=Date.now(),Q=[],startT;
function reconnect(){var o=ws;if(o){o.onclose=null;o.onmessage=null;try{o.close();}catch(x){}}setConn(false);connect();}
setInterval(function(){if(ws&&ws.readyState===1){ws.send('{"t":"ping"}');if(Date.now()-lastMsg>11000)reconnect();}},4000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&Date.now()-lastMsg>11000)reconnect();});
function send(o){var m=JSON.stringify(o);if(ws&&ws.readyState===1)ws.send(m);else{Q.push(m);if(Q.length>5)Q.shift();}}

$('copy').onclick=function(){
  navigator.clipboard.writeText(location.href).then(function(){
    $('copy').textContent='Copied!';setTimeout(function(){$('copy').textContent='Copy link';},1500);
  },function(){toast('Copy failed — copy the URL manually');});
};
$('start').onclick=function(){var b=$('start');b.disabled=true;b.textContent='Starting…';$('msg').textContent='Starting game…';send({t:'start'});
  clearTimeout(startT);startT=setTimeout(function(){if(!st||!st.started||st.winner!=null){toast('Reconnecting…');Q.push('{"t":"start"}');reconnect();}},2500);};
function doRoll(){if(!st||rolling||$('roll').disabled)return;$('roll').disabled=true;startRoll(0);send({t:'roll'});}
$('roll').onclick=doRoll;

function handleState(s){
  var prev=st;st=s;
  if(lastRolls===null)lastRolls=s.rolls;else if(s.rolls!==lastRolls){lastRolls=s.rolls;startRoll(s.dice);}
  if(prev){
    if(s.winner!=null&&prev.winner==null)toast('🏆 '+NAMES[s.winner]+' wins!');
    if(s.turn!==prev.turn&&s.winner==null&&s.started&&s.turn===s.you)toast('Your turn');
    if(prev.tokens&&s.tokens){
      var captured=false;
      for(var seat in s.tokens){
        if(+seat===s.you)continue;
        prev.tokens[seat].forEach(function(q,i){if(q>=0&&q<=50&&s.tokens[seat][i]===-1)captured=true;});
      }
      if(captured)toast('Opponent captured!');
      for(var seat2 in s.tokens){
        prev.tokens[seat2].forEach(function(q,i){
          if(q!==56&&s.tokens[seat2][i]===56&&+seat2===s.you)toast('Token home! 🎉');
        });
      }
    }
  }
  ui();
  if(prev&&prev.tokens&&s.tokens&&s.you!=null){
    var myPrev=prev.tokens[s.you]||[],myNew=s.tokens[s.you]||[];
    for(var i=0;i<4;i++){
      if(myPrev[i]!==myNew[i]){
        anim={seat:s.you,idx:i,from:myPrev[i],to:myNew[i],start:performance.now(),
              dur:Math.max(220,Math.min(700,60*Math.abs(myNew[i]-myPrev[i])+120))};
        requestAnimationFrame(tick);
        break;
      }
    }
  }
}

function ui(){
  var s=st;
  $('countPill').textContent=s.players.length+'/4 players';
  $('pls').innerHTML=s.players.map(function(p){
    var isTurn=s.started&&s.winner==null&&s.turn===p.seat;
    return '<div class="pl '+(isTurn?'turn':'')+' '+(p.online?'':'off')+'">'+
      '<span class="dot" style="background:'+COL[p.seat]+'"></span>'+
      '<span class="nm">'+esc(p.name)+(p.seat===s.you?' (you)':'')+'</span>'+
      '<span class="meta">'+NAMES[p.seat]+(isTurn?' · turn':'')+'</span>'+
    '</div>';
  }).join('');
  var showStart=s.host&&s.players.length>1&&(!s.started||s.winner!=null);
  $('start').hidden=!showStart;$('start').disabled=false;
  if(showStart)$('start').textContent=(s.winner!=null)?'Play again':'Start game';
  var my=s.started&&s.winner==null&&s.turn===s.you;
  $('roll').disabled=!(my&&s.phase==='roll')||rolling;
  dw.classList.toggle('can',!!(my&&s.phase==='roll')&&!rolling);
  if(!rolling)dShow(s.dice);
  $('msg').textContent=!s.started
    ?(s.players.length<2?'Waiting for players (2–4)…':(s.host?'Press Start when ready':'Waiting for host…'))
    :((s.log||'')+(my&&s.phase==='move'?' · tap a glowing token':''));
  draw();
}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function sq(x,y,w,h,f){g.fillStyle=f;g.fillRect(x*C,y*C,w*C,h*C);}
function tri(a,f){g.fillStyle=f;g.beginPath();a.forEach(function(pt,i){g[i?'lineTo':'moveTo'](pt[0]*C,pt[1]*C);});g.fill();}

function draw(){
  g.clearRect(0,0,600,600);g.lineWidth=1;
  YARD.forEach(function(y,s){
    sq(y[0],y[1],6,6,COL[s]);sq(y[0]+1,y[1]+1,4,4,'#fff');
    YO.forEach(function(o){
      g.fillStyle=COL[s]+'55';g.beginPath();
      g.arc((y[0]+o[0]+.5)*C,(y[1]+o[1]+.5)*C,17,0,7);g.fill();g.lineWidth=2;g.strokeStyle=COL[s];g.stroke();
    });
  });
  function box(x,y,f){sq(x,y,1,1,f);g.lineWidth=1;g.strokeStyle='#b4bbcb';g.strokeRect(x*C,y*C,C,C);}
  PATH.forEach(function(pt){box(pt[0],pt[1],'#fff');});
  for(var s=0;s<4;s++){
    var sp=PATH[START[s]];box(sp[0],sp[1],COL[s]);
    for(var k=0;k<5;k++){var hc=HC(s,k);box(hc[0],hc[1],COL[s]);}
  }
  g.fillStyle='#5b6580';g.font='20px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
  SAFE.forEach(function(i){if(i%13)g.fillText('★',(PATH[i][0]+.5)*C,(PATH[i][1]+.5)*C);});
  tri([[6,6],[6,9],[7.5,7.5]],COL[0]);
  tri([[6,6],[9,6],[7.5,7.5]],COL[1]);
  tri([[9,6],[9,9],[7.5,7.5]],COL[2]);
  tri([[6,9],[9,9],[7.5,7.5]],COL[3]);
  var pg=g.createRadialGradient(300,300,4,300,300,38);pg.addColorStop(0,'rgba(255,255,255,.95)');pg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=pg;g.beginPath();g.arc(300,300,38,0,7);g.fill();

  if(!st)return;
  window.TK=[];
  var seen={};
  for(var seat in st.tokens){
    var sn=+seat;
    st.tokens[sn].forEach(function(pos,i){
      var cc=cellOf(sn,i,pos),cx=cc[0],cy=cc[1];
      if(anim&&anim.seat===sn&&anim.idx===i){
        var t=Math.min(1,(performance.now()-anim.start)/anim.dur);
        var e=1-(1-t)*(1-t);
        var total=anim.to-anim.from;
        var cur=anim.from+total*e;
        var baseIdx=Math.floor(cur);
        var stepFrac=cur-baseIdx;
        var b=cellOf(sn,i,baseIdx),n=cellOf(sn,i,baseIdx+1);
        cx=b[0]+(n[0]-b[0])*stepFrac;
        cy=b[1]+(n[1]-b[1])*stepFrac;
      }
      var k=cx+','+cy;seen[k]=(seen[k]||0)+1;var n2=seen[k];
      var x=(cx+.5)*C+(n2-1)*5,y=(cy+.5)*C-(n2-1)*5;
      var mv=st.started&&st.turn===sn&&st.movable.indexOf(i)>=0;
      g.beginPath();g.arc(x,y+2,14,0,7);g.fillStyle='rgba(0,0,0,.25)';g.fill();
      g.beginPath();g.arc(x,y,14,0,7);g.fillStyle=COL[sn];g.fill();
      var grd=g.createRadialGradient(x-4,y-5,2,x,y,14);
      grd.addColorStop(0,'rgba(255,255,255,.85)');
      grd.addColorStop(.5,'rgba(255,255,255,.15)');
      grd.addColorStop(1,'rgba(255,255,255,0)');
      g.beginPath();g.arc(x,y,14,0,7);g.fillStyle=grd;g.fill();
      g.lineWidth=mv?4:2;g.strokeStyle=mv?'#000':'#fff';g.stroke();
      if(mv){
        g.beginPath();g.arc(x,y,18+Math.sin(performance.now()/220)*2,0,7);
        g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=2;g.stroke();
      }
      window.TK.push({x:x,y:y,i:i,mv:mv});
    });
  }
}

function tick(){
  if(anim){
    draw();
    if(performance.now()-anim.start<anim.dur)requestAnimationFrame(tick);
    else{anim=null;draw();ui();}
  }
}
setInterval(function(){if(!anim&&st&&st.started)draw();},400);

cv.onclick=function(e){
  if(!st||anim)return;
  var r=cv.getBoundingClientRect();
  var x=(e.clientX-r.left)*600/r.width,y=(e.clientY-r.top)*600/r.height;
  var t=(window.TK||[]).filter(function(t){return t.mv;})
    .sort(function(a,b){return Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y);})[0];
  if(t&&Math.hypot(t.x-x,t.y-y)<26){
    $('roll').disabled=true;
    send({t:'move',i:t.i});
  }
};

var RM=matchMedia('(prefers-reduced-motion:reduce)').matches,HB=5,DUR=900,TILT=[-14,16];
var FR={1:[0,0],2:[-90,0],3:[0,-90],4:[0,90],5:[90,0],6:[0,180]},PIPS=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
var dw=$('dwrap'),cube=$('cube'),dbody=$('dbody'),dsh=$('dsh'),D={rx:0,ry:0,rz:0,mode:0,t0:0,last:0,ts:0,res:0,from:null,to:null};
cube.innerHTML=[1,2,3,4,5,6].map(function(v){var x='';for(var k=0;k<9;k++)x+='<i'+(PIPS[v].indexOf(k)<0?' style="visibility:hidden"':'')+'></i>';return '<div class="f f'+v+'">'+x+'</div>';}).join('');
function dPaint(h){
  cube.style.transform='rotateX('+D.rx+'deg) rotateY('+D.ry+'deg) rotateZ('+D.rz+'deg)';
  dbody.style.transform='translateY('+(-h)+'px)';
  dsh.style.opacity=Math.max(.15,.5-h/70);dsh.style.transform='scale('+Math.max(.55,1-h/70)+')';
}
function dShow(v){if(D.mode)return;var f=FR[v||1];D.rx=f[0]+TILT[0];D.ry=f[1]+TILT[1];D.rz=0;dPaint(HB);}
function tgt(c,b,sp){return b+360*(Math.ceil((c-b)/360)+sp);}
function startRoll(res){
  if(RM)return;
  if(D.mode){if(res)D.res=res;return;}
  D.mode=1;D.t0=D.last=performance.now();D.res=res||0;rolling=true;requestAnimationFrame(dLoop);
}
function endRoll(){D.mode=0;D.res=0;rolling=false;dShow(st&&st.dice);if(st)ui();}
function dLoop(now){
  if(!D.mode)return;
  var dt=Math.min(40,now-D.last)/16.7,h=HB;D.last=now;
  if(D.mode===1){
    var e=now-D.t0;D.rx+=12*dt;D.ry+=16*dt;D.rz+=8*dt;
    h=HB+Math.min(1,e/160)*(8+Math.abs(Math.sin(e/95))*16);
    if(D.res&&e>=480){D.mode=2;D.ts=now;D.from=[D.rx,D.ry,D.rz];var f=FR[D.res];
      D.to=[tgt(D.rx,f[0]+TILT[0],1),tgt(D.ry,f[1]+TILT[1],2),tgt(D.rz,0,1)];}
    else if(e>4000&&!D.res){endRoll();return;}
  }else{
    var t=Math.min(1,(now-D.ts)/DUR),k=1-Math.pow(1-t,3);
    D.rx=D.from[0]+(D.to[0]-D.from[0])*k;D.ry=D.from[1]+(D.to[1]-D.from[1])*k;D.rz=D.from[2]+(D.to[2]-D.from[2])*k;
    h=HB+Math.abs(Math.sin(t*Math.PI*3))*16*Math.pow(1-t,2);
    if(t>=1){endRoll();return;}
  }
  dPaint(h);requestAnimationFrame(dLoop);
}

addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(cv);fit();
dw.onclick=doRoll;dShow(1);
draw();
